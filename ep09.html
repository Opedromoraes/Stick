<script>
// ============================================================
// LINHA 0 · EP. 09 — "A Regra Escondida"
// Formato novo: abre no gancho, recap curto. Legendas vêm da narração (LEGENDAS).
// ============================================================
const EPISODIO = '09';
const PROXIMA_PARTE = 10;

const CENAS = [
  { inicio: 0, fim: 3.0, draw: cenaGancho },
  { inicio: 3.0, fim: 8.0, draw: cenaRecap },
  { inicio: 8.0, fim: 10.8, draw: cenaAponta },
  { inicio: 10.8, fim: 17.4, draw: cenaAdesivo },
  { inicio: 17.4, fim: 22.4, draw: cenaRegra6 },
  { inicio: 22.4, fim: 26.4, draw: cenaCorredor },
  { inicio: 26.4, fim: 30.0, draw: cenaEspera },
  { inicio: 30.0, fim: 31.85, draw: cenaUltimo },
  { inicio: 31.85, fim: 33.2, draw: cenaCorre },
  { inicio: 33.2, fim: 36.2, draw: cenaContinua },
];

const REGRA = { numero: 6, texto: 'O último passageiro paga a passagem de todos.', vermelhas: ['último', 'todos.'], digita: 3.4 };

// Legendas com o tempo real de cada palavra da narração (ElevenLabs Speech to Text)
const LEGENDAS = [{"palavras": [["Tinha", 0.3], ["uma", 0.54], ["regra", 0.84], ["escondida", 1.1], ["atrás", 1.82], ["do", 2.14], ["adesivo.", 2.22]], "fim": 3.4, "destaques": {"regra": "pista", "escondida": "perigo"}}, {"palavras": [["Antes", 3.4], ["disso...", 3.8], ["o", 4.58], ["motorista", 4.66], ["se", 5.22], ["virou.", 5.36], ["E", 6.16], ["ele", 6.28], ["não", 6.44], ["tinha", 6.68], ["rosto.", 7.06]], "fim": 8.02, "destaques": {"rosto": "perigo"}}, {"palavras": [["Ele", 8.2], ["não", 8.4], ["disse", 8.54], ["nada.", 8.8], ["Só", 9.66], ["apontou", 9.78], ["pra", 10.18], ["janela.", 10.36], ["Pro", 11.12], ["adesivo", 11.28], ["amarelo.", 11.66]], "fim": 12.6, "destaques": {"apontou": "pista", "adesivo": "pista"}}, {"palavras": [["O", 12.6], ["canto", 12.78], ["tava", 13.08], ["descolando.", 13.3], ["Eu", 14.42], ["puxei...", 14.56], ["e", 15.48], ["atrás", 15.6], ["tinha", 16.18], ["mais", 16.5], ["uma", 16.76], ["regra.", 16.98]], "fim": 17.82, "destaques": {"descolando": "pista", "regra": "perigo"}}, {"palavras": [["Regra", 17.9], ["número", 18.22], ["seis.", 18.66], ["O", 19.48], ["último", 19.64], ["passageiro", 19.98], ["paga", 20.72], ["a", 20.9], ["passagem", 20.98], ["de", 21.46], ["todos.", 21.68]], "fim": 22.64, "destaques": {"seis": "perigo", "último": "perigo", "todos": "perigo"}}, {"palavras": [["Eu", 22.8], ["olhei", 22.92], ["pro", 23.14], ["corredor.", 23.28], ["Quase", 24.16], ["todo", 24.62], ["mundo", 24.92], ["já", 25.18], ["tinha", 25.34], ["descido.", 25.52], ["E", 26.46], ["o", 26.52], ["Passageiro", 26.62], ["do", 27.1], ["meu", 27.2], ["lado...", 27.36], ["continuava", 28.0], ["esperando", 28.62], ["eu", 29.08], ["levantar.", 29.16]], "fim": 30.0, "destaques": {"descido": "pista", "passageiro": "perigo", "esperando": "perigo"}}, {"palavras": [["Ele", 30.0], ["queria", 30.18], ["que", 30.48], ["eu", 30.54], ["fosse", 30.68], ["o", 30.94], ["último.", 31.1]], "fim": 31.9, "destaques": {"último": "perigo"}}, {"palavras": [["Então", 31.9], ["eu", 32.14], ["corri.", 32.26]], "fim": 33.1, "destaques": {"corri": "perigo"}}];

const DURACAO = CENAS[CENAS.length - 1].fim;
const FPS = 30;

// ---------- Paleta ----------
const W = 1080, H = 1920;
const COR = {
  ceu: '#070A14', traco: '#E9ECF2', laranja: '#FF8A1F', sodio: '#F5A524',
  perigo: '#E5484D', adesivo: '#F5C518', banco: '#141A28', bancoBorda: '#2A3245',
  sombra: '#000000', contorno: '#6B7180',
};
const TRACO = 14;

// ---------- Utilitários ----------
const lerp = (a, b, k) => a + (b - a) * k;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const suave = k => { k = clamp(k); return k * k * (3 - 2 * k); };
const faixa = (u, a, b) => suave((u - a) / (b - a));
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function ruido(t) { const i = Math.floor(t), f = t - i; return lerp(hash(i), hash(i + 1), suave(f)) * 2 - 1; }

function linha(ctx, pts, cor = COR.traco, larg = TRACO) {
  ctx.strokeStyle = cor; ctx.lineWidth = larg; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.stroke();
}
function rRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// Luz fluorescente que pisca (determinística)
function fluor(t, nervosa = 0) {
  const n = hash(Math.floor(t * 14));
  const lim = 0.94 - nervosa * 0.25;
  if (n > lim) return 0.3 + 0.3 * hash(Math.floor(t * 31));
  return 0.92 + 0.08 * ruido(t * 3);
}

// ---------- Ônibus (vista de frente, olhando pro fundo) ----------
const FUNDO = { x0: 380, x1: 700, y0: 830, y1: 1110 };
function ptParede(lado, d, h) {
  // lado -1 esquerda / 1 direita; d profundidade 0 (perto) .. 1 (fundo); h 0 (teto) .. 1 (chão)
  const xPerto = lado < 0 ? -40 : W + 40, xLonge = lado < 0 ? FUNDO.x0 : FUNDO.x1;
  const x = lerp(xPerto, xLonge, d);
  const topo = lerp(600, FUNDO.y0, d), chao = lerp(H + 60, FUNDO.y1, d);
  return [x, lerp(topo, chao, h)];
}

function desenhaOnibus(ctx, t, o = {}) {
  const luz = o.luz ?? 1;
  ctx.fillStyle = '#05070D'; ctx.fillRect(-200, -200, W + 400, H + 400);

  // paredes
  for (const lado of [-1, 1]) {
    ctx.fillStyle = '#0C1120';
    const a = ptParede(lado, 0, 0), b = ptParede(lado, 1, 0), c = ptParede(lado, 1, 1), d = ptParede(lado, 0, 1);
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c); ctx.lineTo(...d); ctx.fill();
    // janelas
    const jan = [[0.02, 0.3], [0.36, 0.56], [0.61, 0.76], [0.8, 0.9]];
    for (const [d0, d1] of jan) {
      const p = [ptParede(lado, d0, 0.12), ptParede(lado, d1, 0.12), ptParede(lado, d1, 0.36), ptParede(lado, d0, 0.36)];
      ctx.save();
      ctx.beginPath(); ctx.moveTo(...p[0]); p.slice(1).forEach(q => ctx.lineTo(...q)); ctx.closePath();
      ctx.fillStyle = COR.ceu; ctx.fill(); ctx.clip();
      // postes de sódio passando (do perto pro fundo)
      for (let k = 0; k < 3; k++) {
        const prof = ((t * 0.32 + k / 3 + (lado > 0 ? 0.17 : 0)) % 1);
        const [px, py] = ptParede(lado, prof, 0.2);
        const r = lerp(260, 50, prof);
        const g = ctx.createRadialGradient(px, py, 0, px, py, r);
        g.addColorStop(0, 'rgba(245,165,36,0.85)'); g.addColorStop(1, 'rgba(245,165,36,0)');
        ctx.fillStyle = g; ctx.fillRect(px - r, py - r, r * 2, r * 2);
      }
      ctx.restore();
      ctx.strokeStyle = COR.bancoBorda; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(...p[0]); p.slice(1).forEach(q => ctx.lineTo(...q)); ctx.closePath(); ctx.stroke();
    }
  }
  // teto e chão
  ctx.fillStyle = '#0A0E1A';
  ctx.beginPath(); ctx.moveTo(-40, 600); ctx.lineTo(W + 40, 600); ctx.lineTo(FUNDO.x1, FUNDO.y0); ctx.lineTo(FUNDO.x0, FUNDO.y0); ctx.fill();
  ctx.fillStyle = '#0E1322';
  ctx.beginPath(); ctx.moveTo(-40, H + 60); ctx.lineTo(W + 40, H + 60); ctx.lineTo(FUNDO.x1, FUNDO.y1); ctx.lineTo(FUNDO.x0, FUNDO.y1); ctx.fill();
  // fundo do ônibus com janela traseira
  ctx.fillStyle = '#0C1120'; ctx.fillRect(FUNDO.x0, FUNDO.y0, FUNDO.x1 - FUNDO.x0, FUNDO.y1 - FUNDO.y0);
  ctx.fillStyle = COR.ceu; ctx.fillRect(FUNDO.x0 + 30, FUNDO.y0 + 30, FUNDO.x1 - FUNDO.x0 - 60, 110);

  // tubos fluorescentes
  for (const d of [0.12, 0.45, 0.72]) {
    const y = lerp(600, FUNDO.y0, d) + 6;
    const meia = lerp(160, 50, d);
    ctx.save();
    ctx.shadowColor = `rgba(150,255,190,${0.8 * luz})`; ctx.shadowBlur = 40 * luz;
    linha(ctx, [[540 - meia, y], [540 + meia, y]], `rgba(200,255,215,${0.25 + 0.75 * luz})`, lerp(16, 6, d));
    ctx.restore();
  }
  // barra e alças balançando (pêndulo atrasado em relação ao balanço)
  const barraY = 640;
  linha(ctx, [[60, barraY], [1020, barraY]], '#3A4255', 8);
  const ang = o.alca ?? 0;
  for (const x of [150, 330, 750, 930]) {
    const comp = 120;
    const ex = x + Math.sin(ang) * comp, ey = barraY + Math.cos(ang) * comp;
    linha(ctx, [[x, barraY], [ex, ey]], '#3A4255', 6);
    ctx.strokeStyle = '#3A4255'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(ex, ey + 18, 18, 0, Math.PI * 2); ctx.stroke();
  }
}

// ---------- Personagens ----------
function banco(ctx, x, sy, s) {
  ctx.fillStyle = COR.banco; ctx.strokeStyle = COR.bancoBorda; ctx.lineWidth = 6 * s;
  rRect(ctx, x - 105 * s, sy - 290 * s, 210 * s, 300 * s, 24 * s); ctx.fill(); ctx.stroke();
  rRect(ctx, x - 115 * s, sy - 10 * s, 230 * s, 46 * s, 14 * s); ctx.fill(); ctx.stroke();
}

// Passageiro comum: sentado, encarando a frente, sem rosto, imóvel
function passageiro(ctx, x, sy, s) {
  const lw = TRACO * s;
  const omb = sy - 230 * s, cab = omb - 62 * s;
  linha(ctx, [[x, sy], [x, omb]], COR.traco, lw);
  linha(ctx, [[x - 42 * s, omb + 14 * s], [x - 60 * s, sy - 60 * s], [x - 28 * s, sy - 4 * s]], COR.traco, lw);
  linha(ctx, [[x + 42 * s, omb + 14 * s], [x + 60 * s, sy - 60 * s], [x + 28 * s, sy - 4 * s]], COR.traco, lw);
  linha(ctx, [[x - 42 * s, omb + 14 * s], [x, omb], [x + 42 * s, omb + 14 * s]], COR.traco, lw);
  linha(ctx, [[x - 26 * s, sy + 20 * s], [x - 34 * s, sy + 190 * s], [x - 54 * s, sy + 194 * s]], COR.traco, lw);
  linha(ctx, [[x + 26 * s, sy + 20 * s], [x + 34 * s, sy + 190 * s], [x + 54 * s, sy + 194 * s]], COR.traco, lw);
  ctx.fillStyle = COR.traco; ctx.beginPath(); ctx.arc(x, cab, 48 * s, 0, Math.PI * 2); ctx.fill();
}

// Davi: olhos pontuais (gx, gy em -1..1), fechado 0..1, boca 0..1, caixa laranja no colo
function davi(ctx, x, sy, s, o = {}) {
  const { gx = 0, gy = 0, fechado = 0, boca = 0, abaixa = 0, treme = 0 } = o;
  const lw = TRACO * s;
  const omb = sy - 230 * s, cab = omb - 62 * s + abaixa * 10 * s;
  linha(ctx, [[x, sy], [x, omb]], COR.traco, lw);
  linha(ctx, [[x - 42 * s, omb + 14 * s], [x, omb], [x + 42 * s, omb + 14 * s]], COR.traco, lw);
  linha(ctx, [[x - 26 * s, sy + 20 * s], [x - 34 * s, sy + 190 * s], [x - 54 * s, sy + 194 * s]], COR.traco, lw);
  linha(ctx, [[x + 26 * s, sy + 20 * s], [x + 34 * s, sy + 190 * s], [x + 54 * s, sy + 194 * s]], COR.traco, lw);
  // mochila de entrega no colo
  ctx.fillStyle = COR.laranja; rRect(ctx, x - 82 * s, sy - 120 * s, 164 * s, 130 * s, 14 * s); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x - 82 * s, sy - 82 * s, 164 * s, 8 * s);
  // braços abraçando a mochila
  linha(ctx, [[x - 42 * s, omb + 14 * s], [x - 92 * s, sy - 80 * s], [x - 40 * s, sy - 60 * s]], COR.traco, lw);
  linha(ctx, [[x + 42 * s, omb + 14 * s], [x + 92 * s, sy - 80 * s], [x + 40 * s, sy - 60 * s]], COR.traco, lw);
  // cabeça
  const tx = treme * 3 * s;
  ctx.fillStyle = COR.traco; ctx.beginPath(); ctx.arc(x + tx, cab, 48 * s, 0, Math.PI * 2); ctx.fill();
  const ox = x + tx + gx * 15 * s, oy = cab - 4 * s + gy * 14 * s;
  ctx.fillStyle = COR.ceu; ctx.strokeStyle = COR.ceu;
  for (const lado of [-1, 1]) {
    const ex = ox + lado * 15 * s;
    if (fechado > 0.5) { linha(ctx, [[ex - 8 * s, oy + 2 * s], [ex + 8 * s, oy + 2 * s]], COR.ceu, 5 * s); }
    else { ctx.beginPath(); ctx.ellipse(ex, oy, 6.5 * s, 6.5 * s * (1 - fechado * 1.6), 0, 0, Math.PI * 2); ctx.fill(); }
  }
  if (boca > 0.02) {
    ctx.fillStyle = COR.ceu; ctx.beginPath();
    ctx.ellipse(x + tx + gx * 6 * s, cab + 24 * s, 9 * s, 3 * s + boca * 11 * s, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// O Passageiro: 1,25× mais alto, preto com contorno cinza, cabeça alongada, sem rosto
function oPassageiro(ctx, x, sy, s, o = {}) {
  const S = s * 1.25;
  const omb = sy - 230 * S, cab = omb - 92 * S;
  const membros = [
    [[x, sy], [x, omb]],
    [[x - 42 * S, omb + 14 * S], [x, omb], [x + 42 * S, omb + 14 * S]],
    [[x + 42 * S, omb + 14 * S], [x + 62 * S, sy - 60 * S], [x + 28 * S, sy - 4 * S]],
    [[x - 26 * S, sy + 20 * S], [x - 34 * S, sy + 150 * S], [x - 54 * S, sy + 154 * S]],
    [[x + 26 * S, sy + 20 * S], [x + 34 * S, sy + 150 * S], [x + 54 * S, sy + 154 * S]],
  ];
  // braço esquerdo (da tela): repousa no colo ou estica até o banco do Davi
  const k = o.alcance ?? 0;
  const ombE = [x - 42 * S, omb + 14 * S];
  const maoRep = [x - 28 * S, sy - 4 * S], maoAlvo = o.alvo ?? maoRep;
  const mao = [lerp(maoRep[0], maoAlvo[0], k), lerp(maoRep[1], maoAlvo[1], k)];
  const cot = [lerp(x - 62 * S, (ombE[0] + mao[0]) / 2, k), lerp(sy - 60 * S, (ombE[1] + mao[1]) / 2 - 25 * S, k)];
  membros.push([ombE, cot, mao]);
  for (const passo of [[COR.contorno, TRACO * S + 8], [COR.sombra, TRACO * S]]) {
    for (const m of membros) linha(ctx, m, passo[0], passo[1]);
  }
  // dedos longos sobre a borda do banco
  if (k > 0.85) {
    const a = (k - 0.85) / 0.15;
    for (let i = -1; i <= 1; i++) {
      const f = [[mao[0], mao[1]], [mao[0] - 10 + i * 14, mao[1] + 34 * a], [mao[0] - 4 + i * 16, mao[1] + 58 * a]];
      linha(ctx, f, COR.contorno, 10); linha(ctx, f, COR.sombra, 5);
    }
  }
  ctx.fillStyle = COR.sombra; ctx.strokeStyle = COR.contorno; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(x, cab, 42 * S, 74 * S, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
}

// ---------- Cena base: interior com todos os passageiros ----------
const DAVI = { x: 290, sy: 1530, s: 1 };
const ALTO = { x: 590, sy: 1530 };
const ALVO_MAO = [395, 1250]; // borda do encosto do banco do Davi, ao lado do ombro

function interior(ctx, t, o = {}) {
  const giro = o.giro ?? 0;
  // ônibus gira; passageiros ficam imóveis
  ctx.save();
  ctx.translate(540, 1700); ctx.rotate(giro); ctx.translate(-540, -1700);
  desenhaOnibus(ctx, t, { luz: o.luz, alca: -giro * 6 });
  ctx.restore();

  // fileira 3 e 2 (fundo) — imóveis
  for (const [x, sy, s] of [[430, 1140, 0.45], [650, 1140, 0.45], [380, 1260, 0.62], [740, 1260, 0.62]]) {
    banco(ctx, x, sy, s); passageiro(ctx, x, sy, s);
  }
  // fileira 1
  ctx.save();
  ctx.translate(540, 1700); ctx.rotate(giro * 0.9); ctx.translate(-540, -1700); // só o Davi acompanha o balanço
  banco(ctx, DAVI.x, DAVI.sy, 1);
  davi(ctx, DAVI.x, DAVI.sy, 1, o.davi);
  ctx.restore();
  banco(ctx, ALTO.x, ALTO.sy, 1);
  banco(ctx, 900, 1530, 1); passageiro(ctx, 900, 1530, 1);
  oPassageiro(ctx, ALTO.x, ALTO.sy, 1, { alcance: o.alcance ?? 0, alvo: ALVO_MAO });

  // luz fluorescente esverdeada
  const l = o.luz ?? 1;
  ctx.fillStyle = `rgba(110,255,170,${0.05 * l})`; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(0,0,0,${(1 - l) * 0.55})`; ctx.fillRect(0, 0, W, H);
}

function vinheta(ctx, forca = 0.7, cor = '0,0,0') {
  const g = ctx.createRadialGradient(540, 1100, 300, 540, 1100, 1250);
  g.addColorStop(0, `rgba(${cor},0)`); g.addColorStop(1, `rgba(${cor},${forca})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- Extras do motor (Ep. 03 em diante) ----------
// Passageiro comum com opções: vira (-1..1, cabeça desliza na direção do Davi), olhos (0..1, aparecem olhos)
function passageiroO(ctx, x, sy, s, o = {}) {
  passageiro(ctx, x, sy, s);
  const vira = o.vira ?? 0, olhos = o.olhos ?? 0;
  if (!vira && !olhos) return;
  const omb = sy - 230 * s, cab = omb - 62 * s;
  // redesenha a cabeça deslocada
  ctx.fillStyle = COR.banco; ctx.beginPath(); ctx.arc(x, cab, 50 * s, 0, Math.PI * 2); ctx.fill();
  const cx = x + vira * 14 * s;
  linha(ctx, [[x, omb], [cx, cab + 40 * s]], COR.traco, TRACO * s);
  ctx.fillStyle = COR.traco; ctx.beginPath(); ctx.arc(cx, cab, 48 * s, 0, Math.PI * 2); ctx.fill();
  if (olhos > 0) {
    ctx.fillStyle = `rgba(7,10,20,${olhos})`;
    const ox = cx + vira * 20 * s;
    for (const l of [-1, 1]) { ctx.beginPath(); ctx.arc(ox + l * 15 * s, cab - 2 * s, 7 * s * olhos, 0, Math.PI * 2); ctx.fill(); }
  }
}

// Interior com opções novas: pass (opções dos passageiros), sumir (lista de x de quem sumiu), vermelho (0..1)
function interiorX(ctx, t, o = {}) {
  const giro = o.giro ?? 0;
  ctx.save();
  ctx.translate(540, 1700); ctx.rotate(giro); ctx.translate(-540, -1700);
  desenhaOnibus(ctx, t, { luz: o.luz, alca: -giro * 6 });
  portaAberta(ctx, t, o.porta ?? 0, o.portaTreme ?? 0);
  ctx.restore();
  const sumir = o.sumir || [];
  for (const [x, sy, s] of [[430, 1140, 0.45], [650, 1140, 0.45], [380, 1260, 0.62], [740, 1260, 0.62]]) {
    banco(ctx, x, sy, s);
    if (o.semFundo) continue;
    if (o.dePe != null) { if (o.dePe > 0) { passageiroEmPe(ctx, x, sy + 194 * s - 130 * s * o.dePe, s); continue; } }
    if (o.senhora && x === 740) { senhora(ctx, x, sy, s, o.senhora); continue; }
    if (o.vazio740 && x === 740) continue;
    if (sumir.includes(x)) { if (o.adesivoNoBanco) adesivinho(ctx, x, sy - 30 * s, s); continue; }
    const p = o.pass || {};
    passageiroO(ctx, x, sy, s, { olhos: p.olhos, vira: (p.vira ?? 0) * (x > DAVI.x ? -1 : 1) });
  }
  ctx.save();
  ctx.translate(540, 1700); ctx.rotate(giro * 0.9); ctx.translate(-540, -1700);
  banco(ctx, DAVI.x, DAVI.sy, 1);
  if (!o.semDavi) davi(ctx, DAVI.x, DAVI.sy, 1, o.davi);
  ctx.restore();
  banco(ctx, ALTO.x, ALTO.sy, 1);
  banco(ctx, 900, 1530, 1);
  if (sumir.includes(900) && o.adesivoNoBanco) adesivinho(ctx, 900, 1530 - 40, 1);
  if (!sumir.includes(900)) { const p = o.pass || {}; passageiroO(ctx, 900, 1530, 1, { olhos: p.olhos, vira: -(p.vira ?? 0) }); }
  if (!o.semAlto) oPassageiro(ctx, ALTO.x, ALTO.sy, 1, { alcance: o.alcance ?? 0, alvo: ALVO_MAO });
  if (o.depois) o.depois();
  const l = o.luz ?? 1;
  ctx.fillStyle = `rgba(110,255,170,${0.05 * l * (1 - (o.vermelho ?? 0))})`; ctx.fillRect(0, 0, W, H);
  luzVermelha(ctx, o.vermelho ?? 0);
  ctx.fillStyle = `rgba(0,0,0,${(1 - l) * 0.55})`; ctx.fillRect(0, 0, W, H);
}

function luzVermelha(ctx, v) {
  if (v <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = `rgb(255,${Math.round(lerp(255, 70, v))},${Math.round(lerp(255, 70, v))})`;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgba(229,40,50,${0.12 * v})`; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

function adesivinho(ctx, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(0.12);
  ctx.fillStyle = COR.adesivo; rRect(ctx, -60 * s, -40 * s, 120 * s, 80 * s, 8 * s); ctx.fill();
  ctx.fillStyle = '#0B0B0B'; ctx.fillRect(-60 * s, -30 * s, 120 * s, 16 * s);
  ctx.font = `${Math.round(34 * s)}px "Archivo Black"`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('Nº 4', 0, 14 * s);

}

// Efeito VHS do "Anteriormente"
function vhs(ctx, u) {
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (let y = 0; y < H; y += 6) ctx.fillRect(0, y, W, 2);
  for (let i = 0; i < 260; i++) {
    const n = hash(i + Math.floor(u * 24) * 997);
    ctx.fillStyle = `rgba(233,236,242,${0.08 * hash(i * 3.1 + n)})`;
    ctx.fillRect(n * W, hash(i * 7.7 + n) * H, 3, 3);
  }
  vinheta(ctx, 0.85);
  ctx.font = '44px "Archivo Black"'; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = COR.perigo; ctx.beginPath(); ctx.arc(760, 1838, 12, 0, Math.PI * 2);
  if (Math.floor(u * 2) % 2 === 0) ctx.fill();
  ctx.fillStyle = COR.traco; ctx.fillText('ANTERIORMENTE', 1040, 1854);
}

// Retrovisor pequeno no alto (olhos do motorista). abre 0..1, olhar -1..1, sorri 0..1
function retroInset(ctx, abre, olhar = -0.2, sorri = 0) {
  const mx = 560, my = 700, mw = 440, mh = 150;
  ctx.save(); rRect(ctx, mx, my, mw, mh, 30); ctx.clip();
  ctx.fillStyle = '#0C1220'; ctx.fillRect(mx, my, mw, mh);
  for (const ex of [mx + 150, mx + 290]) {
    const ab = abre * lerp(1, 0.45, sorri);
    ctx.save(); ctx.beginPath(); ctx.ellipse(ex, my + 80, 40, 14 * ab + 0.1, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = '#D9D2BE'; ctx.fillRect(ex - 45, my + 60, 90, 40);
    ctx.fillStyle = '#0A0A0A'; ctx.beginPath(); ctx.arc(ex + olhar * 14, my + 82, 11, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (sorri > 0) { // rugas do sorriso embaixo dos olhos
      ctx.strokeStyle = `rgba(217,210,190,${0.7 * sorri})`; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(ex, my + 70, 44, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
    }
  }
  ctx.restore();
  ctx.strokeStyle = '#2E3546'; ctx.lineWidth = 10; rRect(ctx, mx, my, mw, mh, 30); ctx.stroke();
}

// Cartão de regra (genérico: usa REGRA)
function cartaoRegra(ctx, u, fundo) {
  ctx.save(); ctx.filter = 'blur(6px) brightness(0.45)'; fundo(); ctx.restore();
  vinheta(ctx, 0.7);
  const e = faixa(u, 0, 0.35);
  const esc = lerp(1.35, 1, e) + Math.sin(clamp((u - 0.35) / 0.3) * Math.PI) * 0.025;
  const w = 860, h = 780;
  ctx.save();
  ctx.globalAlpha = e;
  ctx.translate(540, 1240); ctx.rotate(-0.035); ctx.scale(esc, esc);
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16;
  ctx.fillStyle = COR.adesivo; rRect(ctx, -w / 2, -h / 2, w, h, 22); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#C9A10F'; ctx.beginPath(); ctx.moveTo(w / 2, h / 2 - 70); ctx.lineTo(w / 2 - 70, h / 2); ctx.lineTo(w / 2 - 60, h / 2 - 60); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#0B0B0B'; ctx.fillRect(-w / 2, -h / 2 + 50, w, 110);
  ctx.fillStyle = COR.adesivo; ctx.font = '52px "Archivo Black"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('AVISO AOS PASSAGEIROS', 0, -h / 2 + 106);
  ctx.fillStyle = '#0B0B0B'; ctx.font = '118px "Archivo Black"';
  ctx.fillText(`REGRA Nº ${REGRA.numero}`, 0, -h / 2 + 270);
  linha(ctx, [[-w / 2 + 70, -h / 2 + 350], [w / 2 - 70, -h / 2 + 350]], '#0B0B0B', 6);
  const n = Math.floor(clamp((u - 1.0) / REGRA.digita) * REGRA.texto.length);
  ctx.font = '58px "Special Elite"'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const linhas = quebra(ctx, REGRA.texto, w - 150);
  let resta = n, ly = -h / 2 + 440, ultimo = [-w / 2 + 75, ly];
  for (const l of linhas) {
    if (resta <= 0) break;
    const parte = l.slice(0, resta);
    let cx = -w / 2 + 75;
    for (const pal of parte.split(/( )/)) {

      ctx.fillStyle = v ? '#B3141B' : '#111'; ctx.fillText(pal, cx, ly); cx += ctx.measureText(pal).width;
    }

  }

  ctx.restore();
}

// ---------- Extras do motor (Ep. 05 em diante) ----------
// Porta da frente aberta na parede direita do ônibus (perto da câmera). abre 0..1
function portaAberta(ctx, t, abre, treme = 0) {
  if (abre <= 0) return;
  const p = [ptParede(1, 0.06, 0.2), ptParede(1, 0.22, 0.2), ptParede(1, 0.22, 0.98), ptParede(1, 0.06, 0.98)];
  ctx.save();
  ctx.beginPath(); ctx.moveTo(...p[0]); p.slice(1).forEach(q => ctx.lineTo(...q)); ctx.closePath();
  ctx.fillStyle = '#020204'; ctx.fill(); ctx.clip();
  // escuridão lá fora com neblina avermelhada
  const g = ctx.createRadialGradient(p[1][0], (p[1][1] + p[2][1]) / 2, 20, p[1][0], (p[1][1] + p[2][1]) / 2, 520);
  g.addColorStop(0, `rgba(120,30,35,${0.35 + 0.1 * Math.sin(t * 2)})`); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  // luz vermelha da rua entrando pela porta e caindo no corredor
  const gl = ctx.createRadialGradient(W, 1550, 40, W, 1550, 700);
  gl.addColorStop(0, `rgba(200,50,55,${0.32 * abre})`); gl.addColorStop(1, 'rgba(200,50,55,0)');
  ctx.fillStyle = gl; ctx.fillRect(W - 700, 850, 700, 1070);
  // folhas da porta (recolhidas conforme abre; tremem se a porta tenta fechar)
  const tr = treme * Math.sin(t * 40) * 0.03;
  for (const lado of [0, 1]) {
    const d0 = lado ? 0.22 - 0.08 * (1 - abre + tr) : 0.06, d1 = lado ? 0.22 : 0.06 + 0.08 * (1 - abre + tr);
    const f = [ptParede(1, d0, 0.2), ptParede(1, d1, 0.2), ptParede(1, d1, 0.98), ptParede(1, d0, 0.98)];
    ctx.fillStyle = '#1A2133'; ctx.strokeStyle = COR.bancoBorda; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.moveTo(...f[0]); f.slice(1).forEach(q => ctx.lineTo(...q)); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

// Passageiro comum em pé, de perfil andando (passo = fase)
function passageiroEmPe(ctx, x, fy, s, passo = null, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha;
  const lw = TRACO * s, quad = fy - 190 * s, omb = quad - 230 * s, cab = omb - 62 * s;
  const sw = passo == null ? 0 : Math.sin(passo);
  linha(ctx, [[x, quad], [x, omb]], COR.traco, lw);
  linha(ctx, [[x, omb + 10 * s], [x + sw * 40 * s, quad - 20 * s]], COR.traco, lw);
  linha(ctx, [[x, omb + 10 * s], [x - sw * 40 * s, quad - 20 * s]], COR.traco, lw);
  linha(ctx, [[x, quad], [x + sw * 50 * s, fy]], COR.traco, lw);
  linha(ctx, [[x, quad], [x - sw * 50 * s, fy]], COR.traco, lw);
  ctx.fillStyle = COR.traco; ctx.beginPath(); ctx.arc(x, cab, 48 * s, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// Senhora: coque, óculos, bengala. vira (0..1 cabeça vira pro Davi), sorri (0..1 dentes demais)
function senhora(ctx, x, sy, s, o = {}) {
  const { vira = 0, sorri = 0, acena = 0, t = 0 } = o;
  const lw = TRACO * s, omb = sy - 220 * s, cab = omb - 62 * s;
  linha(ctx, [[x, sy], [x, omb]], COR.traco, lw);
  linha(ctx, [[x - 40 * s, omb + 14 * s], [x, omb], [x + 40 * s, omb + 14 * s]], COR.traco, lw);
  linha(ctx, [[x - 26 * s, sy + 20 * s], [x - 34 * s, sy + 190 * s], [x - 54 * s, sy + 194 * s]], COR.traco, lw);
  linha(ctx, [[x + 26 * s, sy + 20 * s], [x + 34 * s, sy + 190 * s], [x + 54 * s, sy + 194 * s]], COR.traco, lw);
  // bengala
  linha(ctx, [[x + 70 * s, sy - 70 * s], [x + 90 * s, sy + 194 * s]], '#8A6A40', 10 * s);
  linha(ctx, [[x + 40 * s, omb + 14 * s], [x + 66 * s, sy - 90 * s], [x + 72 * s, sy - 70 * s]], COR.traco, lw);
  // braço esquerdo: no colo ou batendo no banco ao lado ("senta aqui")
  const bate = acena ? Math.abs(Math.sin(t * 5)) * acena : 0;
  linha(ctx, [[x - 40 * s, omb + 14 * s], [x - 80 * s, sy - 60 * s - bate * 30 * s], [x - 130 * s, sy - 10 * s - bate * 40 * s]], COR.traco, lw);
  // cabeça + coque
  const cx = x - vira * 16 * s;
  ctx.fillStyle = COR.traco;
  ctx.beginPath(); ctx.arc(cx + 30 * s, cab - 40 * s, 22 * s, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cab, 48 * s, 0, Math.PI * 2); ctx.fill();
  if (vira > 0.3) {
    // óculos redondos
    const ox = cx - vira * 14 * s;
    ctx.strokeStyle = '#2A2F3A'; ctx.lineWidth = 4 * s;
    for (const l of [-1, 1]) { ctx.beginPath(); ctx.arc(ox + l * 17 * s, cab - 4 * s, 12 * s, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = COR.ceu;
    for (const l of [-1, 1]) { ctx.beginPath(); ctx.arc(ox + l * 17 * s, cab - 4 * s, 4.5 * s, 0, Math.PI * 2); ctx.fill(); }
    if (sorri > 0) sorrisoDentes(ctx, ox, cab + 20 * s, 44 * s * (0.6 + 0.4 * sorri), 22 * s * sorri, sorri);
    else { ctx.strokeStyle = COR.ceu; ctx.lineWidth = 4 * s; ctx.beginPath(); ctx.arc(ox, cab + 12 * s, 14 * s, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke(); }
  }
}

// Sorriso com dentes demais (meia-lua escura cheia de dentinhos)
function sorrisoDentes(ctx, x, y, larg, alt, k) {
  ctx.save();
  ctx.fillStyle = '#12060A';
  ctx.beginPath(); ctx.ellipse(x, y, larg, Math.max(1, alt), 0, 0, Math.PI); ctx.lineTo(x - larg, y); ctx.fill();
  const n = Math.round(lerp(6, 22, k));
  ctx.fillStyle = '#F3EDE0';
  for (const linhaD of [0, 1]) {
    for (let i = 0; i < n; i++) {
      const fx = x - larg + (i + 0.5) * (2 * larg / n), w = (2 * larg / n) * 0.8;
      const yy = linhaD ? y + alt * 0.95 : y;
      ctx.beginPath();
      if (linhaD) { ctx.moveTo(fx - w / 2, yy); ctx.lineTo(fx + w / 2, yy); ctx.lineTo(fx, yy - alt * 0.45); }
      else { ctx.moveTo(fx - w / 2, yy); ctx.lineTo(fx + w / 2, yy); ctx.lineTo(fx, yy + alt * 0.45); }
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.restore();
}

// Exterior: ônibus parado no nada, porta aberta (do Ep. 04)
function paradaExterior(ctx, t, o = {}) {

  ctx.fillStyle = '#050608'; for (const rx of [x + 170, x + w - 230]) { ctx.beginPath(); ctx.arc(rx, y + h, 62, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#050608'; ctx.fillRect(x + w - 330, y + 16, 250, 44);
  ctx.fillStyle = COR.laranja; ctx.font = '34px "Archivo Black"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('LINHA 0', x + w - 205, y + 40);
  if (sil > 0) {

    ctx.globalAlpha = 1;

// ---------- Extras do motor (Ep. 07 em diante) ----------
const BILHETE = ['Se você tá lendo isso,', 'não dorme.', 'Conta as paradas.', 'São 13.', 'Na última,', 'NÃO esteja dentro', 'do ônibus.'];

// Bilhete escrito à mão. nPal = quantas palavras já apareceram (Infinity = tudo). assina 0..1
function bilhete(ctx, cx, cy, esc, rot, nPal = Infinity, assina = 0, destaque = 0) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(esc, esc);
  const w = 820, h = 1000;
  ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
  ctx.fillStyle = '#E9E1CC'; ctx.beginPath();
  ctx.moveTo(-w / 2, -h / 2 + 10); ctx.lineTo(w / 2 - 6, -h / 2); ctx.lineTo(w / 2, h / 2 - 8); ctx.lineTo(-w / 2 + 8, h / 2); ctx.closePath(); ctx.fill();
  ctx.shadowColor = 'transparent';
  // dobras
  ctx.strokeStyle = 'rgba(120,100,70,0.35)'; ctx.lineWidth = 3;
  for (const y of [-h / 6, h / 6]) { ctx.beginPath(); ctx.moveTo(-w / 2, y); ctx.lineTo(w / 2, y + 4); ctx.stroke(); }
  // manchas
  ctx.fillStyle = 'rgba(120,90,50,0.12)';
  ctx.beginPath(); ctx.ellipse(250, -330, 90, 60, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(-280, 360, 70, 40, -0.3, 0, Math.PI * 2); ctx.fill();
  // texto
  ctx.font = '78px "Reenie Beanie", "Caveat", cursive'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let k = 0, y = -h / 2 + 150;
  for (const l of BILHETE) {
    let x = -w / 2 + 60;
    const forte = l.startsWith('NÃO');
    for (const p of l.split(' ')) {
      if (k >= nPal) break;
      ctx.fillStyle = forte ? '#7A0E12' : '#1A1712';
      const realce = (l === 'Conta as paradas.') ? destaque : 0;
      if (realce > 0) { ctx.fillStyle = `rgba(229,72,77,${0.25 * realce})`; ctx.fillRect(x - 6, y - 60, ctx.measureText(p).width + 12, 74); ctx.fillStyle = '#1A1712'; }
      ctx.fillText(p, x, y); x += ctx.measureText(p + ' ').width; k++;
    }
    if (forte && k >= nPal + 0 && nPal >= 0) { /* sublinhado quando completo */ }
    y += 104;
  }
  if (nPal === Infinity || k >= 15) { // sublinha o NÃO
    ctx.strokeStyle = '#7A0E12'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(-w / 2 + 58, -h / 2 + 150 + 104 * 5 + 14); ctx.lineTo(-w / 2 + 170, -h / 2 + 150 + 104 * 5 + 18); ctx.stroke();
  }
  if (assina > 0) {
    ctx.globalAlpha = assina; ctx.fillStyle = '#1A1712'; ctx.font = '110px "Reenie Beanie", "Caveat", cursive';
    ctx.fillText('— D.', w / 2 - 260, h / 2 - 70); ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// Close na fresta do banco com o papel saindo (k 0..1 puxando)
function frestaBanco(ctx, t, k) {
  ctx.fillStyle = '#05070D'; ctx.fillRect(0, 0, W, H);
  const luz = fluor(t);
  // encosto (em cima) e assento (embaixo), bem perto
  ctx.fillStyle = '#1B2336'; rRect(ctx, -60, 260, W + 120, 780, 70); ctx.fill();
  ctx.fillStyle = '#18202F'; rRect(ctx, -60, 1080, W + 120, 900, 70); ctx.fill();
  // costuras
  ctx.strokeStyle = 'rgba(80,95,125,0.5)'; ctx.lineWidth = 6; ctx.setLineDash([22, 18]);
  ctx.beginPath(); ctx.moveTo(40, 340); ctx.lineTo(W - 40, 340); ctx.moveTo(40, 1160); ctx.lineTo(W - 40, 1160); ctx.stroke(); ctx.setLineDash([]);
  // fresta
  ctx.fillStyle = '#020306'; ctx.fillRect(-60, 1030, W + 120, 60);
  // papel dobrado saindo da fresta
  const px = 520, py = lerp(1080, 760, suave(k));
  ctx.save(); ctx.translate(px, py); ctx.rotate(-0.08 + 0.1 * k);
  ctx.fillStyle = '#E9E1CC'; ctx.fillRect(-150, -170, 300, 340);
  ctx.strokeStyle = 'rgba(120,100,70,0.5)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(-150, 0); ctx.lineTo(150, 4); ctx.stroke();
  ctx.fillStyle = 'rgba(26,23,18,0.55)'; ctx.font = '54px "Reenie Beanie", cursive'; ctx.fillText('se você', -120, -80);
  ctx.restore();
  // fresta cobre a parte de baixo do papel
  ctx.fillStyle = '#18202F'; rRect(ctx, -60, 1088, W + 120, 900, 70); ctx.fill();
  ctx.fillStyle = '#020306'; ctx.fillRect(-60, 1030, W + 120, 58);
  // mão do Davi (vem da esquerda) pegando o papel
  const hx = lerp(-200, px - 120, faixa(k, 0, 0.35)), hy = py - 40;
  linha(ctx, [[-120, 1500], [hx - 40, hy + 120]], COR.traco, 30);
  for (let i = 0; i < 3; i++) linha(ctx, [[hx - 40, hy + 120], [hx + 40 + i * 6, hy + 40 + i * 34]], COR.traco, 22);
  ctx.fillStyle = `rgba(110,255,170,${0.05 * luz})`; ctx.fillRect(0, 0, W, H);
  vinheta(ctx, 0.75);
}

// Vista pela janela lateral, com placas de ponto passando. num = número da parada que passa; desacel 0..1 (1 = parado)
function janelaParadas(ctx, t, paradas, o = {}) {
  ctx.fillStyle = '#04060B'; ctx.fillRect(0, 0, W, H);
  // moldura da janela
  const jx = 70, jy = 360, jw = W - 140, jh = 1000;
  ctx.save(); rRect(ctx, jx, jy, jw, jh, 50); ctx.clip();
  const g = ctx.createLinearGradient(0, jy, 0, jy + jh); g.addColorStop(0, '#070A14'); g.addColorStop(1, '#141A2C');
  ctx.fillStyle = g; ctx.fillRect(jx, jy, jw, jh);
  ctx.fillStyle = '#0B0E18'; ctx.fillRect(jx, jy + jh * 0.72, jw, jh);
  // cada parada: placa que cruza a janela da direita pra esquerda num intervalo [ini, fim]
  for (const p of paradas) {
    const k = clamp((t - p.ini) / (p.fim - p.ini));
    if (k <= 0 || k >= 1) { if (!(p.para && k >= 1)) continue; }
    const kk = p.para ? Math.min(k, 1) : k;
    const x = p.para ? lerp(jx + jw + 300, jx + jw * 0.55, 1 - Math.pow(1 - kk, 3)) : lerp(jx + jw + 300, jx - 300, kk);
    // poste de luz junto
    const lg = ctx.createRadialGradient(x, jy + 160, 10, x, jy + 160, 380);
    lg.addColorStop(0, `rgba(245,165,36,${p.vermelho ? 0 : 0.35})`); lg.addColorStop(1, 'rgba(245,165,36,0)');
    if (!p.vermelho) { ctx.fillStyle = lg; ctx.fillRect(x - 380, jy - 220, 760, 760); }
    linha(ctx, [[x, jy + jh * 0.74], [x, jy + 300]], '#3A4052', 16);
    ctx.fillStyle = p.vermelho ? '#7A1218' : '#E9ECF2'; rRect(ctx, x - 150, jy + 150, 300, 190, 18); ctx.fill();
    ctx.fillStyle = p.vermelho ? '#F3D7D2' : '#0B0B0B'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = p.texto ? '56px "Archivo Black"' : '30px "Archivo Black"';
    if (p.texto) { ctx.fillText(p.texto[0], x, jy + 215); ctx.fillText(p.texto[1], x, jy + 285); }
    else { ctx.fillText('PONTO', x, jy + 190); ctx.font = '96px "Archivo Black"'; ctx.fillText(String(p.n), x, jy + 275); }
  }
  ctx.restore();
  ctx.strokeStyle = '#2A3245'; ctx.lineWidth = 26; rRect(ctx, jx, jy, jw, jh, 50); ctx.stroke();
  // reflexo do Davi no vidro
  ctx.globalAlpha = 0.13; ctx.fillStyle = COR.traco; ctx.beginPath(); ctx.arc(330, 980, 120, 0, Math.PI * 2); ctx.fill();
  linha(ctx, [[330, 1100], [330, 1360]], COR.traco, 30); ctx.globalAlpha = 1;
  // número grande contado
  if (o.grande != null) {
    const a = o.grandeA ?? 1;
    ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${o.grandeTam || 300}px "Archivo Black"`; ctx.lineWidth = 26; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round';
    ctx.strokeText(String(o.grande), 540, 1600); ctx.fillStyle = o.grandeCor || COR.adesivo; ctx.fillText(String(o.grande), 540, 1600);
    ctx.globalAlpha = 1;
  }
  vinheta(ctx, 0.7);
}

// Motorista visto de trás do banco dele; vira 0 (de costas) .. 1 (de frente, sem rosto)
function motorista(ctx, t, vira, z = 1) {
  ctx.save(); ctx.translate(540, 1200); ctx.scale(z, z); ctx.translate(-540, -1200);
  ctx.fillStyle = '#03050A'; ctx.fillRect(-200, -200, W + 400, H + 400);
  // para-brisa com estrada
  ctx.fillStyle = '#070A14'; ctx.fillRect(-200, 300, W + 400, 700);
  for (let k = 0; k < 3; k++) {
    const p = (t * 0.2 + k / 3) % 1, px = lerp(540, k % 2 ? 1300 : -200, p), r = lerp(30, 320, p * p);
    const g = ctx.createRadialGradient(px, 820, 0, px, 820, r); g.addColorStop(0, 'rgba(245,165,36,0.5)'); g.addColorStop(1, 'rgba(245,165,36,0)');
    ctx.fillStyle = g; ctx.fillRect(px - r, 820 - r, r * 2, r * 2);
  }
  ctx.fillStyle = '#03050A'; ctx.fillRect(-200, 980, W + 400, 1200);
  // volante
  ctx.strokeStyle = '#1C2230'; ctx.lineWidth = 30; ctx.beginPath(); ctx.ellipse(700, 1120, 230, 90, 0, 0, Math.PI * 2); ctx.stroke();
  // tronco (uniforme)
  ctx.fillStyle = '#121A2C'; rRect(ctx, 340, 1000, 400, 700, 120); ctx.fill();
  // cabeça: de costas = cabelo/boné; de frente = rosto liso
  const cx = 540, cy = 820, r = 150;
  const larg = Math.abs(Math.cos(vira * Math.PI)) * 0.25 + 0.75;
  if (vira < 0.5) {
    ctx.fillStyle = '#0C0D10'; ctx.beginPath(); ctx.ellipse(cx, cy, r * larg, r * 1.12, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#D9D2BE'; ctx.beginPath(); ctx.ellipse(cx, cy, r * larg, r * 1.12, 0, 0, Math.PI * 2); ctx.fill();
    // sombreamento leve, nenhum traço de rosto
    const sg = ctx.createRadialGradient(cx - 40, cy - 40, 20, cx, cy, r * 1.2);
    sg.addColorStop(0, 'rgba(255,255,255,0.15)'); sg.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.ellipse(cx, cy, r * larg, r * 1.12, 0, 0, Math.PI * 2); ctx.fill();
  }
  // boné
  ctx.fillStyle = '#121A2C'; ctx.beginPath(); ctx.ellipse(cx, cy - 110, r * larg * 1.05, 70, 0, Math.PI, 0); ctx.fill();
  const aba = vira < 0.5 ? -1 : 1;
  ctx.fillRect(cx - r * larg * 1.05, cy - 116, r * larg * 2.1, 22);
  if (vira >= 0.5) { ctx.beginPath(); ctx.ellipse(cx, cy - 98, r * larg * 1.1, 26, 0, 0, Math.PI); ctx.fill(); }
  ctx.fillStyle = COR.adesivo; ctx.font = '30px "Archivo Black"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (vira >= 0.5) ctx.fillText('0', cx, cy - 150);
  ctx.restore();
}

// ---------- Rua / ônibus de fora / Davi em pé (vindos do Ep. 01) ----------
const PREDIOS = (() => {
  const out = []; let x = -40, i = 0;
  while (x < W + 40) {
    const w = 110 + hash(i) * 170, h = 260 + hash(i + 50) * 480, jan = [];
    for (let y = 0; y < h - 70; y += 70) for (let jx = 24; jx < w - 34; jx += 52) if (hash(i * 31 + y + jx) < 0.16) jan.push([jx, y + 40]);
    out.push({ x, w, h, jan, tom: hash(i + 9) }); x += w + 6; i++;
  }
  return out;
})();

function rua(ctx, t, camadaOnibus) {
  const g = ctx.createLinearGradient(0, 0, 0, 1150);
  g.addColorStop(0, COR.ceu); g.addColorStop(1, '#151B30');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) {
    ctx.globalAlpha = 0.3 + 0.35 * Math.sin(t * 2 + i);
    ctx.fillStyle = '#CFD6FF'; ctx.fillRect(hash(i) * W, hash(i + 100) * 900, 2 + hash(i + 7) * 2, 2 + hash(i + 7) * 2);
  }
  ctx.globalAlpha = 1;
  const lua = ctx.createRadialGradient(830, 250, 40, 830, 250, 220);
  lua.addColorStop(0, 'rgba(220,226,255,0.25)'); lua.addColorStop(1, 'rgba(220,226,255,0)');
  ctx.fillStyle = lua; ctx.fillRect(560, 0, 540, 520);
  ctx.fillStyle = '#DFE3F0'; ctx.beginPath(); ctx.arc(830, 250, 58, 0, Math.PI * 2); ctx.fill();
  for (const p of PREDIOS) {
    ctx.fillStyle = p.tom > 0.5 ? '#0B0F1B' : '#0E1322'; ctx.fillRect(p.x, 1150 - p.h, p.w, p.h);
    ctx.fillStyle = 'rgba(245,165,36,0.55)';
    for (const j of p.jan) ctx.fillRect(p.x + j[0], 1150 - p.h + j[1], 20, 28);
  }
  ctx.fillStyle = '#0E1118'; ctx.fillRect(0, 1150, W, 300);
  ctx.save(); ctx.setLineDash([60, 50]); linha(ctx, [[0, 1300], [W, 1300]], '#3A3F4A', 8); ctx.restore();
  if (camadaOnibus) camadaOnibus();
  ctx.fillStyle = '#161B26'; ctx.fillRect(0, 1450, W, 470);
  ctx.fillStyle = COR.bancoBorda; ctx.fillRect(0, 1450, W, 12);
  // relógio de rua
  ctx.fillStyle = '#262C38'; ctx.fillRect(112, 1180, 14, 540);
  ctx.fillStyle = '#050608'; rRect(ctx, 40, 1070, 160, 96, 10); ctx.fill();
  ctx.fillStyle = COR.perigo; ctx.font = '56px "Archivo Black"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Math.floor(t) % 2 ? '00:05' : '00 05', 120, 1120);
  // abrigo do ponto
  ctx.fillStyle = 'rgba(120,150,190,0.08)'; ctx.fillRect(400, 1290, 380, 300);
  ctx.fillStyle = '#2B3445'; ctx.fillRect(388, 1250, 420, 34); ctx.fillRect(404, 1284, 14, 436); ctx.fillRect(772, 1284, 14, 436);
  ctx.fillStyle = '#1D2433'; ctx.fillRect(420, 1560, 340, 22);
  // poste de sódio
  const f = fluor(t * 0.5);
  const cone = ctx.createLinearGradient(0, 860, 0, 1720);
  cone.addColorStop(0, `rgba(245,165,36,${0.32 * f})`); cone.addColorStop(1, 'rgba(245,165,36,0)');
  ctx.fillStyle = cone; ctx.beginPath(); ctx.moveTo(800, 860); ctx.lineTo(560, 1720); ctx.lineTo(1060, 1720); ctx.closePath(); ctx.fill();
  linha(ctx, [[940, 1720], [940, 820], [800, 820]], '#262C38', 16);
  ctx.fillStyle = f > 0.6 ? '#FFD28A' : '#6B5426'; ctx.fillRect(770, 822, 64, 22);
}

function onibusLateral(ctx, x, t, o = {}) {
  const y = 1010, w = 1100, h = 420, luz = fluor(t);
  ctx.fillStyle = '#232B36'; rRect(ctx, x, y, w, h, 26); ctx.fill();
  ctx.fillStyle = '#1A2029'; ctx.fillRect(x, y + h - 70, w, 30);
  for (let i = 0; i < 5; i++) {
    const jx = x + 40 + i * 190;
    ctx.fillStyle = `rgba(150,225,170,${0.28 * luz})`; ctx.fillRect(jx, y + 70, 160, 150);
    // passageiros de perfil, imóveis
    ctx.fillStyle = 'rgba(8,12,10,0.9)'; ctx.beginPath(); ctx.arc(jx + 80, y + 150, 26, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(jx + 66, y + 176, 28, 44);
  }
  // porta da frente
  const porta = o.porta ?? 0;
  ctx.fillStyle = `rgba(150,225,170,${0.35 * luz + 0.3 * porta})`; ctx.fillRect(x + w - 120, y + 60, 90, 300);
  ctx.fillStyle = '#232B36'; ctx.fillRect(x + w - 120 + 90 * porta * 0.8, y + 60, 90 * (1 - porta * 0.8), 300);
  // letreiro
  const let_ = o.letreiro ?? 'LINHA 0', lw_ = let_.length > 8 ? 360 : 250;
  ctx.fillStyle = '#050608'; ctx.fillRect(x + w - 80 - lw_, y + 16, lw_, 44);
  ctx.fillStyle = o.letreiroCor ?? COR.laranja; ctx.font = '34px "Archivo Black"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(let_, x + w - 80 - lw_ / 2, y + 40);
  ctx.fillStyle = '#050608';
  for (const rx of [x + 170, x + w - 230]) { ctx.beginPath(); ctx.arc(rx, y + h, 62, 0, Math.PI * 2); ctx.fill(); }
  // farol
  const fx = ctx.createLinearGradient(x + w, 0, x + w + 600, 0);
  fx.addColorStop(0, 'rgba(255,240,200,0.5)'); fx.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = fx; ctx.beginPath(); ctx.moveTo(x + w, y + 300); ctx.lineTo(x + w + 700, y + 200); ctx.lineTo(x + w + 700, y + 460); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#FFF3CF'; ctx.fillRect(x + w - 14, y + 290, 14, 30);
}

// Davi em pé, de frente; mochila de entrega nas costas (aparece atrás dos ombros)
// costas: true = visto de trás (sem olhos). passo: fase da caminhada
function daviEmPe(ctx, x, fy, s, o = {}) {
  const { gx = 0, gy = 0, costas = false, passo = null, treme = 0 } = o;
  const lw = TRACO * s, quadril = fy - 190 * s, omb = quadril - 230 * s, cab = omb - 62 * s;
  const sw = passo == null ? 0 : Math.sin(passo);
  if (!costas) { ctx.fillStyle = COR.laranja; rRect(ctx, x - 92 * s, omb - 34 * s, 184 * s, 170 * s, 14 * s); ctx.fill(); }
  linha(ctx, [[x, quadril], [x, omb]], COR.traco, lw);
  linha(ctx, [[x - 42 * s, omb + 14 * s], [x, omb], [x + 42 * s, omb + 14 * s]], COR.traco, lw);
  linha(ctx, [[x - 42 * s, omb + 14 * s], [x - 70 * s - sw * 20 * s, quadril - 30 * s]], COR.traco, lw);
  linha(ctx, [[x + 42 * s, omb + 14 * s], [x + 70 * s + sw * 20 * s, quadril - 30 * s]], COR.traco, lw);
  linha(ctx, [[x - 22 * s, quadril], [x - 34 * s, fy - Math.max(0, sw) * 24 * s]], COR.traco, lw);
  linha(ctx, [[x + 22 * s, quadril], [x + 34 * s, fy - Math.max(0, -sw) * 24 * s]], COR.traco, lw);
  if (costas) {
    ctx.fillStyle = COR.laranja; rRect(ctx, x - 82 * s, omb - 20 * s, 164 * s, 160 * s, 14 * s); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x - 82 * s, omb + 30 * s, 164 * s, 8 * s);
  }
  const tx = treme * 3 * s;
  ctx.fillStyle = COR.traco; ctx.beginPath(); ctx.arc(x + tx, cab, 48 * s, 0, Math.PI * 2); ctx.fill();
  if (costas) return;
  const ox = x + tx + gx * 15 * s, oy = cab - 4 * s + gy * 14 * s;
  ctx.fillStyle = COR.ceu;
  for (const lado of [-1, 1]) { ctx.beginPath(); ctx.arc(ox + lado * 15 * s, oy, 6.5 * s, 0, Math.PI * 2); ctx.fill(); }
}

// ============================================================
// CENAS — Ep. 09 "A Regra Escondida"  (abre no gancho, recap curto)
// ============================================================
const SUMIDOS = [900];
const FILA = [[790, 1250, 0.5], [770, 1330, 0.6], [810, 1420, 0.7], [780, 1530, 0.82], [830, 1660, 0.95]];
const REGRAS_FRENTE = ['1. Nunca olhe pro passageiro', '   do seu lado.', '2. Nunca diga seu bairro.', '3. Luz vermelha: durma.', '4. Não desça sem ponto.', '5. Recuse o lugar.'];

// Adesivo amarelo colado no vidro, em close. peel 0..1 = quanto o canto de baixo descolou.
// mao 0..1 = mão do Davi chegando no canto. brilho 0..1 = a regra escondida acende
function adesivoJanela(ctx, t, peel, mao = 0, brilho = 0, z = 1) {
  ctx.fillStyle = '#04060B'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(540, 1150); ctx.scale(z, z); ctx.translate(-540, -1150);
  // vidro com reflexos
  const g = ctx.createLinearGradient(0, 200, 0, 1900); g.addColorStop(0, '#0A0F1C'); g.addColorStop(1, '#141B2E');
  ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400);
  ctx.fillStyle = 'rgba(200,220,255,0.035)';
  ctx.beginPath(); ctx.moveTo(-100, 500); ctx.lineTo(300, 200); ctx.lineTo(420, 200); ctx.lineTo(20, 500); ctx.fill();
  ctx.save(); ctx.translate(540, 1150); ctx.rotate(-0.03);
  const w = 820, h = 900, s2 = Math.SQRT1_2;
  const d = Math.min(560, peel * 560);
  const L = (w / 2 + h / 2) * s2 - d;                 // linha da dobra: (x+y)·s2 = L
  const ref = (x, y) => { const k = (x + y) * s2 - L; return [x - 2 * k * s2, y - 2 * k * s2]; };
  // 1) o que tem atrás (escrito no vidro, em vermelho)
  ctx.save();
  ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip();
  ctx.fillStyle = '#0B0E18'; ctx.fillRect(-w / 2, -h / 2, w, h);
  ctx.fillStyle = `rgba(229,72,77,${0.75 + 0.25 * brilho})`;
  ctx.shadowColor = `rgba(229,72,77,${0.8 * brilho})`; ctx.shadowBlur = 40 * brilho;
  ctx.font = '150px "Reenie Beanie", "Caveat", cursive'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.translate(230, 260); ctx.rotate(-0.12);
  ctx.fillText('Nº 6', 0, 0);
  ctx.font = '62px "Reenie Beanie", "Caveat", cursive'; ctx.fillText('o último paga', -10, 110);
  ctx.restore();
  ctx.restore();
  // 2) frente do adesivo, sem o canto descolado
  ctx.save();
  ctx.beginPath(); ctx.moveTo(-w / 2 - 50, -h / 2 - 50); ctx.lineTo(w / 2 + 50, -h / 2 - 50);
  const fy = L / s2 - (w / 2 + 50), fx = L / s2 - (h / 2 + 50);
  ctx.lineTo(w / 2 + 50, fy); ctx.lineTo(fx, h / 2 + 50); ctx.lineTo(-w / 2 - 50, h / 2 + 50); ctx.closePath(); ctx.clip();
  ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 30;
  ctx.fillStyle = COR.adesivo; rRect(ctx, -w / 2, -h / 2, w, h, 22); ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#0B0B0B'; ctx.fillRect(-w / 2, -h / 2 + 50, w, 110);
  ctx.fillStyle = COR.adesivo; ctx.font = '52px "Archivo Black"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('AVISO AOS PASSAGEIROS', 0, -h / 2 + 106);
  ctx.fillStyle = '#111'; ctx.font = '50px "Special Elite"'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  REGRAS_FRENTE.forEach((l, i) => ctx.fillText(l, -w / 2 + 60, -h / 2 + 270 + i * 92));
  ctx.restore();
  // 3) aba dobrada (verso do adesivo, papel)
  if (d > 1) {
    const pR = [w / 2, fy], pB = [fx, h / 2], C = ref(w / 2, h / 2);
    ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 30; ctx.shadowOffsetX = -10; ctx.shadowOffsetY = -10;
    ctx.fillStyle = '#D8CDA8'; ctx.beginPath(); ctx.moveTo(pR[0], pR[1]); ctx.lineTo(C[0], C[1]); ctx.lineTo(pB[0], pB[1]); ctx.closePath(); ctx.fill();
    ctx.shadowColor = 'transparent'; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    const gg = ctx.createLinearGradient(pR[0], pR[1], C[0], C[1]); gg.addColorStop(0, 'rgba(0,0,0,0.25)'); gg.addColorStop(1, 'rgba(255,255,255,0.1)');
    ctx.fillStyle = gg; ctx.fill();
    // mão do Davi segurando a ponta
    if (mao > 0) {
      const hx = lerp(C[0] + 500, C[0], mao), hy = lerp(C[1] + 700, C[1], mao);
      linha(ctx, [[hx + 420, hy + 760], [hx + 40, hy + 60]], COR.traco, 34);
      for (let i = 0; i < 3; i++) linha(ctx, [[hx + 40, hy + 60], [hx - 20 + i * 22, hy - 10 + i * 10]], COR.traco, 24);
    }
  }
  ctx.restore();
  ctx.restore();
  ctx.fillStyle = `rgba(110,255,170,${0.05 * fluor(t, 0.3)})`; ctx.fillRect(0, 0, W, H);
  vinheta(ctx, 0.7);
}

// Motorista apontando (braço vindo do ombro esquerdo da tela)
function motoristaAponta(ctx, t, k, z) {
  motorista(ctx, t, 1, z);
  ctx.save(); ctx.translate(540, 1200); ctx.scale(z, z); ctx.translate(-540, -1200);
  const omb = [400, 1080], mao = [lerp(380, 60, k), lerp(1300, 820, k)], cot = [lerp(330, 220, k), lerp(1220, 1000, k)];
  linha(ctx, [omb, cot, mao], '#121A2C', 70);
  ctx.fillStyle = '#D9D2BE'; ctx.beginPath(); ctx.arc(mao[0], mao[1], 34, 0, Math.PI * 2); ctx.fill();
  linha(ctx, [mao, [mao[0] - 70 * k, mao[1] - 40 * k]], '#D9D2BE', 20);
  ctx.restore();
}

// 1. GANCHO: o canto do adesivo sendo puxado
function cenaGancho(ctx, u) {
  adesivoJanela(ctx, u, lerp(0.2, 0.55, faixa(u, 0.2, 2.2)), 1, faixa(u, 1.4, 2.2), lerp(1.25, 1.35, u / 3));
}

// 2. Recap: o motorista se vira, sem rosto (VHS)
function cenaRecap(ctx, u) {
  const t = 31 + u;
  ctx.save(); ctx.filter = 'grayscale(0.6) contrast(1.1) brightness(0.9)';
  motorista(ctx, t, faixa(u, 0.6, 2.2), lerp(1.1, 1.5, faixa(u, 1.8, 4.2)));
  ctx.restore();
  vhs(ctx, u);
}

// 3. Ele não diz nada, só aponta pra janela
function cenaAponta(ctx, u) {
  const t = 36 + u;
  motoristaAponta(ctx, t, faixa(u, 1.2, 1.9), lerp(1.3, 1.0, faixa(u, 0, 2.6)));
  vinheta(ctx, 0.7, '120,20,25');
}

// 4. O adesivo: o canto descolando, a mão puxa, aparece a regra escondida
function cenaAdesivo(ctx, u) {
  const t = 10.8 + u;
  const treme = faixa(t, 12.9, 13.4) * 0.05 * (1 + Math.sin(t * 9)) * (1 - faixa(t, 14.2, 14.5));
  const peel = 0.04 + treme + faixa(t, 14.4, 15.5) * 0.66;
  adesivoJanela(ctx, t, peel, faixa(t, 13.9, 14.5), faixa(t, 16.6, 17.2), lerp(1.0, 1.12, faixa(u, 0, 6.6)));
}

// 5. Cartão: Regra Nº 6
function cenaRegra6(ctx, u) {
  const t = 17.4 + u;
  cartaoRegra(ctx, u, () => { ctx.fillStyle = '#0A0F1C'; ctx.fillRect(0, 0, W, H); ctx.fillStyle = `rgba(229,72,77,${0.10 + 0.06 * Math.sin(t * 3)})`; ctx.fillRect(0, 0, W, H); });
}

function filaRestante(ctx, t) {
  const sai = Math.max(0, (t - 22.6) / 0.75);
  FILA.forEach(([x, fy, s], i) => {
    const k = clamp(sai - (FILA.length - 1 - i) * 0.6);
    if (k >= 1) return;
    passageiroEmPe(ctx, x + k * 260 * s, fy, s, t * 5 + i, 1 - suave(k));
  });
}

// 6. O corredor esvaziando
function cenaCorredor(ctx, u) {
  const t = 22.4 + u;
  const z = lerp(1.05, 1.15, faixa(u, 0, 4));
  ctx.save(); ctx.translate(540, 1300); ctx.scale(z, z); ctx.translate(-540, -1300);
  interiorX(ctx, t, { luz: fluor(t, 0.3), sumir: SUMIDOS, semFundo: true, porta: 1, alcance: 0,
    davi: { gx: 1, gy: -0.3, treme: 0.25 * ruido(u * 24) }, depois: () => filaRestante(ctx, t) });
  ctx.restore();
  vinheta(ctx, 0.65);
}

// 7. Só sobrou ele — o Passageiro esperando o Davi levantar
function cenaEspera(ctx, u) {
  const t = 26.4 + u;
  const z = lerp(1.35, 1.75, faixa(u, 0, 3.6));
  ctx.save(); ctx.translate(540, 1180); ctx.scale(z, z); ctx.translate(-440, -1220);
  interiorX(ctx, t, { luz: fluor(t, 0.5), sumir: SUMIDOS, semFundo: true, porta: 1, alcance: 0,
    davi: { gx: lerp(1, 0.4, faixa(t, 28.0, 28.4)), gy: -0.3, treme: 0.4 * ruido(u * 28) } });
  ctx.restore();
  vinheta(ctx, 0.75);
}

// 8. Close: ele queria que eu fosse o último
function cenaUltimo(ctx, u) {
  const t = 30 + u;
  closeDavi(ctx, t, u, lerp(2.0, 2.4, faixa(u, 0, 1.9)),
    { luz: fluor(t, 0.7), sumir: SUMIDOS, semFundo: true, porta: 1, alcance: 0,
      davi: { gx: t < 31.0 ? 1 : 0, gy: -0.2, treme: 0.6 * ruido(u * 30), boca: faixa(t, 31.0, 31.3) * 0.5 } });
  vinheta(ctx, 0.8);
}

// 9. Então eu corri
function cenaCorre(ctx, u) {
  const t = 31.85 + u;
  const k = faixa(u, 0.25, 1.3);
  interiorX(ctx, t, { luz: fluor(t, 0.8), sumir: SUMIDOS, semFundo: true, semDavi: true, porta: 1, alcance: 0,
    giro: 0.02 * ruido(u * 20), vermelho: 0.5 + 0.5 * faixa(u, 0.3, 0.8) });
  daviEmPe(ctx, lerp(300, 900, k), lerp(1760, 1900, k), lerp(0.95, 1.2, k), { costas: true, passo: u * 16 });
  const choque = faixa(u, 0.38, 0.45) * (1 - faixa(u, 0.45, 1.2));
  if (choque > 0) vinheta(ctx, 0.85 * choque, '229,72,77');
  vinheta(ctx, 0.7);
}

// Fim do Ep. 09: chama o último episódio
function cenaContinua(ctx, u) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (u < 0.12) { ctx.fillStyle = 'rgba(229,72,77,0.35)'; ctx.fillRect(0, 0, W, H); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = COR.traco; ctx.font = '150px "Archivo Black"';
  ctx.fillText('CONTINUA', 540, 880);
  ctx.fillStyle = COR.perigo; ctx.font = '58px "Archivo Black"';
  ctx.fillText('ÚLTIMO EPISÓDIO', 540, 1010);
  ctx.fillStyle = COR.adesivo; ctx.font = '54px "Archivo Black"';
  ctx.fillText('AMANHÃ, 21H', 540, 1090);
  ctx.fillStyle = '#8A90A0'; ctx.font = '44px "Archivo Black"';
  ctx.fillText('@continuaamanha.tv', 540, 1190);
}

// ============================================================
// Legenda palavra a palavra (terço superior)
// ============================================================
function quebra(ctx, texto, larg) {
  const pals = texto.split(' '), linhas = []; let atual = '';
  for (const p of pals) {
    const teste = atual ? atual + ' ' + p : p;
    if (ctx.measureText(teste).width > larg && atual) { linhas.push(atual); atual = p; } else atual = teste;
  }
  if (atual) linhas.push(atual);
  return linhas;
}
const normaliza = p => p.toLowerCase().replace(/[.,!?…:;"“”]/g, '');

function desenhaLegenda(ctx, _cena, t) {
  // Legenda sincronizada com a narração: cada palavra aparece quando é falada.
  const L = LEGENDAS.find(l => t >= l.palavras[0][1] - 0.02 && t < l.fim);
  if (!L) return;
  // grupos de até 4 palavras, quebrando depois de pontuação
  if (!L.grupos) {
    L.grupos = []; let g = [];
    L.palavras.forEach(([p], i) => { g.push(i); if (g.length === 4 || /[.,?!:…]$/.test(p)) { L.grupos.push(g); g = []; } });
    if (g.length) L.grupos.push(g);
  }
  let atual = -1;
  L.palavras.forEach(([, tp], i) => { if (tp <= t) atual = i; });
  if (atual < 0) return;
  const grupo = L.grupos.find(g => g.includes(atual));
  ctx.font = '88px "Archivo Black"'; ctx.textBaseline = 'middle';
  const esp = ctx.measureText(' ').width, MAX = 940;
  const linhasPal = []; let lin = [], larg = 0;
  for (const i of grupo) {
    const w = ctx.measureText(L.palavras[i][0].toUpperCase()).width;
    if (lin.length && larg + esp + w > MAX) { linhasPal.push(lin); lin = []; larg = 0; }
    lin.push(i); larg += (lin.length > 1 ? esp : 0) + w;
  }
  linhasPal.push(lin);
  const y0 = 470 - (linhasPal.length - 1) * 52;
  linhasPal.forEach((l, li) => {
    const total = l.reduce((s, i, j) => s + ctx.measureText(L.palavras[i][0].toUpperCase()).width + (j ? esp : 0), 0);
    let x = 540 - total / 2;
    for (const i of l) {
      const [p, tp] = L.palavras[i], P = p.toUpperCase(), w = ctx.measureText(P).width;
      if (i <= atual) {
        const pop = 1 + 0.2 * (1 - faixa(t, tp, tp + 0.1));
        const tipo = L.destaques[normaliza(p)];
        ctx.save(); ctx.translate(x + w / 2, y0 + li * 104); ctx.scale(pop, pop);
        ctx.textAlign = 'center';
        ctx.lineWidth = 16; ctx.strokeStyle = '#000'; ctx.lineJoin = 'round'; ctx.strokeText(P, 0, 0);
        ctx.fillStyle = tipo === 'perigo' ? COR.perigo : tipo === 'pista' ? COR.adesivo : (L.cor || '#FFFFFF');
        ctx.fillText(P, 0, 0);
        ctx.restore();
      }
      x += w + esp;
    }
  });
}

function desenhaTag(ctx) {
  ctx.font = '38px "Archivo Black"'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const txt = `LINHA 0 · EP. ${EPISODIO}`, w = ctx.measureText(txt).width;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; rRect(ctx, 48, 96, w + 48, 70, 12); ctx.fill();
  ctx.fillStyle = COR.adesivo; ctx.fillRect(48, 96, 10, 70);
  ctx.fillStyle = COR.traco; ctx.fillText(txt, 78, 132);
}

// ============================================================
// Motor
// ============================================================
const tela = document.getElementById('tela');
const ctx = tela.getContext('2d');

function renderFrame(t) {
  t = clamp(t, 0, DURACAO - 1e-6);
  const cena = CENAS.find(c => t >= c.inicio && t < c.fim) || CENAS[CENAS.length - 1];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1;
  ctx.fillStyle = COR.ceu; ctx.fillRect(0, 0, W, H);
  ctx.save(); cena.draw(ctx, t - cena.inicio); ctx.restore();
  if (cena.draw !== cenaContinua) { desenhaLegenda(ctx, cena, t); desenhaTag(ctx); }
  document.getElementById('relogio').textContent = t.toFixed(2) + ' s';
}

const pronto = Promise.all([
  document.fonts.load('84px "Archivo Black"'),
  document.fonts.load('58px "Special Elite"'),
]).catch(() => {}).then(() => document.fonts.ready);

window.renderFrame = renderFrame;
window.DURACAO = DURACAO;
window.FPS = FPS;
window.pronto = pronto;

const params = new URLSearchParams(location.search);
if (params.has('render')) document.body.classList.add('render');
let tocando = false, t0 = 0, base = 0;
function loop(agora) {
  if (!tocando) return;
  const t = base + (agora - t0) / 1000;
  if (t >= DURACAO) { tocando = false; renderFrame(DURACAO); playBtn.textContent = '▶ Play'; return; }
  renderFrame(t); requestAnimationFrame(loop);
}
const playBtn = document.getElementById('play');
let tAtual = parseFloat(params.get('t')) || 0;
playBtn.onclick = () => {
  if (tocando) { tocando = false; base += (performance.now() - t0) / 1000; playBtn.textContent = '▶ Play'; return; }
  if (base >= DURACAO) base = 0;
  tocando = true; t0 = performance.now(); playBtn.textContent = '❚❚ Pausar'; requestAnimationFrame(loop);
};
document.getElementById('reiniciar').onclick = () => { base = 0; t0 = performance.now(); renderFrame(0); };
pronto.then(() => { base = tAtual; renderFrame(tAtual); });
</script>
